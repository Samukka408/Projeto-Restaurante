{% extends "base.html" %}
{% block conteudo %}
<h2>Editar Prato</h2>
<form method="POST" action="/pratos/atualizar/{{ prato.id_prato }}" class="form-padrao">
    <label>Nome do Prato:</label>
    <input type="text" name="nome" value="{{ prato.nome }}" required>
    
    <label>Descrição:</label>
    <input type="text" name="descricao" value="{{ prato.descricao }}">
    
    <label>Preço (R$):</label>
    <input type="number" step="0.01" name="preco" value="{{ prato.preco }}" required>
    
    <label>Categoria:</label>
    <input type="text" name="categoria" value="{{ prato.categoria }}">
    
    <label>Status:</label>
    <select name="status" required>
        <option value="Disponível" {% if prato.status == 'Disponível' %}selected{% endif %}>Disponível</option>
        <option value="Esgotado" {% if prato.status == 'Esgotado' %}selected{% endif %}>Esgotado</option>
    </select>
    
    <button type="submit">Atualizar Prato</button>
</form>
<br>
<a href="/pratos">Voltar para o cardápio</a>
{% endblock %}
