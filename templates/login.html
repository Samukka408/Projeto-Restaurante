<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sabor Express</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="tela-login">
    <div class="login-container">
        <!-- Lado Esquerdo (Textos) -->
        <div class="login-left">
            <h1>Bem-vindo!</h1>
            <p>Faça seu login e aproveite o melhor da nossa comida.</p>
        </div>
        
        <!-- Lado Direito (Formulário) -->
        <div class="login-right">
            <h2>Entrar</h2>
            
            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <label>E-mail ou usuário:</label>
                <input type="text" name="login" placeholder="Digite seu usuário" required>
                
                <label>Senha:</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required>
                
                <button type="submit">Entrar ➔</button>
            </form>
            
            <p class="teste-login">Usuário de teste: <strong>admin</strong> / Senha: <strong>123</strong></p>
        </div>
    </div>
</body>
</html>
